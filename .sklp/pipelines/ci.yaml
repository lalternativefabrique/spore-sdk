version: 1
kind: pipeline
name: ci

tools:
  node: "24.16.0"
  gitleaks: "8.18.4"
  pnpm: "11.3.0"
  rust: "1.90.0"

steps:
  # This repository is public: a secret that reaches main is published and must be revoked, not deleted.
  - name: gitleaks
    tools: [gitleaks]
    run: |
      if git rev-parse --git-dir >/dev/null 2>&1; then
        gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      else
        gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      fi

  - name: sdk-go
    tools: [go]
    run: |
      cd sdk-go
      go build ./...
      go vet ./...
      go test -count=1 ./...

  - name: sdk-node
    tools: [node]
    run: |
      CI=true npx -y pnpm@11.3.0 install --frozen-lockfile
      npx -y pnpm@11.3.0 --filter @lalternative/spore-codegen test
      npx -y pnpm@11.3.0 --filter @lalternative/spore-sdk build
      npx -y pnpm@11.3.0 --filter @lalternative/spore-sdk typecheck

  - name: sdk-generated
    tools: [rust]
    run: |
      python3 -m compileall -q sdk-python/spore_email
      find sdk-php/lib -type f -name "*.php" -exec sh -c \
        "for file do php -l \"\$file\" >/dev/null || exit 1; done" sh {} +
      find sdk-ruby/lib -type f -name "*.rb" -exec sh -c \
        "for file do ruby -c \"\$file\" >/dev/null || exit 1; done" sh {} +
      cargo check --manifest-path sdk-rust/Cargo.toml
      cargo test --manifest-path sdk-rust/Cargo.toml
